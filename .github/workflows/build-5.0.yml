name: Build Maktab Islami Fiqh 5.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK 5.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT_DIR="."
          else
            SETTINGS=$(find . -type f -name "settings.gradle" -print -quit)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check project
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "===== Project ====="
          ls -la

          echo "===== Gradle ====="
          cat build.gradle

          echo "===== App Gradle ====="
          cat app/build.gradle

          echo "===== Data ====="
          if [ -d "app/src/main/assets/data" ]; then
            du -sh app/src/main/assets/data
            find app/src/main/assets/data -type f | head -100
          else
            echo "WARNING: assets/data not found"
          fi

      - name: Build Debug APK
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p artifacts

          cp "${{ steps.apk.outputs.apk }}" \
            "artifacts/Maktab-Islami-Fiqh-5.0-debug.apk"

          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-Fiqh-5.0
          path: artifacts/Maktab-Islami-Fiqh-5.0-debug.apk
          if-no-files-found: error
          retention-days: 30
