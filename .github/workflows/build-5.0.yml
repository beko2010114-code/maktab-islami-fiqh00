name: Build Maktab Islami Fiqh 5.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK 5.0
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # 4. إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. تثبيت Android SDK
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. البحث عن ملف ZIP وفك الضغط
      - name: Extract Maktab Islami 5.0
        shell: bash
        run: |
          set -e

          echo "===== Files in repository ====="
          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "===== Extracted files ====="
          find extracted -maxdepth 5 -type f | sort | head -300

      # 7. العثور تلقائيًا على مشروع Android
      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          echo "Searching for settings.gradle..."

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."

            echo "===== Extracted structure ====="
            find extracted -maxdepth 8 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "WARNING: app directory not found directly."

            echo "Searching for Android app module..."

            APP_GRADLE=$(find "$PROJECT_DIR" \
              -type f \
              \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) \
              -print -quit)

            if [ -n "$APP_GRADLE" ]; then
              PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
              echo "Adjusted project:"
              echo "$PROJECT_DIR"
            fi
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 8. فحص المشروع
      - name: Check Android project
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "===== PROJECT ====="
          echo "$PROJECT_DIR"

          echo "===== PROJECT FILES ====="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

          echo "===== SETTINGS ====="

          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            cat "$PROJECT_DIR/settings.gradle"
          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            cat "$PROJECT_DIR/settings.gradle.kts"
          fi

          echo "===== APP MODULE ====="

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            cat "$PROJECT_DIR/app/build.gradle"
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/app/build.gradle.kts"
          else
            echo "WARNING: app/build.gradle not found."
          fi

          echo "===== OFFLINE DATA ====="

          if [ -d "$PROJECT_DIR/app/src/main/assets/data" ]; then
            du -sh "$PROJECT_DIR/app/src/main/assets/data"
            find "$PROJECT_DIR/app/src/main/assets/data" \
              -type f | head -100
          else
            echo "No assets/data directory found."
          fi

      # 9. بناء APK
      - name: Build APK 5.0
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "===== Starting Gradle build ====="

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      # 10. البحث عن APK الناتج
      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "===== APK search ====="
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # 11. تجهيز اسم APK
      - name: Prepare APK
        run: |
          set -e

          mkdir -p artifacts

          cp "${{ steps.apk.outputs.apk }}" \
            "artifacts/Maktab-Islami-Fiqh-5.0-debug.apk"

          echo "===== Final APK ====="
          ls -lh artifacts/

      # 12. رفع APK كملف يمكن تنزيله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-Fiqh-5.0
          path: artifacts/Maktab-Islami-Fiqh-5.0-debug.apk
          if-no-files-found: error
          retention-days: 30
