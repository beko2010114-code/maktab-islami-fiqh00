name: Build Maktab Islami 4.9

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find ZIP file
        id: zip
        shell: bash
        run: |
          echo "Searching for ZIP file..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "${{ steps.zip.outputs.zip_file }}" \
            -d extracted_project

          echo "ZIP extracted successfully."

          echo "Top-level extracted contents:"
          find extracted_project -maxdepth 3 -type f | head -200

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Searching for Android project..."

          PROJECT_DIR=""

          # First try Gradle wrapper
          GRADLEW=$(find extracted_project \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "Found Gradle wrapper:"
            echo "$GRADLEW"
          fi

          # If gradlew is missing, search for settings.gradle
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS_FILE=$(find extracted_project \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
              echo "Found Android project using settings file:"
              echo "$SETTINGS_FILE"
            fi
          fi

          # If still not found, search for build.gradle
          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted_project \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
              echo "Found Gradle project using build file:"
              echo "$BUILD_FILE"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android/Gradle project was not found."

            echo "All extracted files:"
            find extracted_project -maxdepth 8 -type f | head -500

            exit 1
          fi

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "Using Gradle wrapper."
            ./gradlew --version
          else
            echo "No gradlew found."
            echo "Using installed Gradle."
            gradle --version
          fi

      - name: Check Android project
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "Project files:"
          ls -la

          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -print

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "Starting Android build..."

          if [ -f "gradlew" ]; then
            ./gradlew clean assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle clean assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Find APK
        id: apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Searching all APK files:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            echo "Build output directories:"
            find "$PROJECT_DIR" \
              -type d \
              -path "*/build/outputs*" \
              -print

            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare APK artifact
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          cp "${{ steps.apk.outputs.apk_path }}" \
            "artifacts/Maktab-Islami-4.9-debug.apk"

          echo "Prepared APK:"
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-4.9
          path: artifacts/Maktab-Islami-4.9-debug.apk
          if-no-files-found: error
          retention-days: 30
