name: Build Maktab Islami 4.9

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find ZIP file
        id: zip
        shell: bash
        run: |
          echo "Searching for ZIP file..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "${{ steps.zip.outputs.zip_file }}" \
            -d extracted_project

          echo "ZIP extracted successfully."

          echo "Extracted files:"
          find extracted_project -maxdepth 4 -type f | head -200

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Searching for Gradle Android project..."

          GRADLEW=$(find extracted_project \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "Project contents:"
            find extracted_project -maxdepth 6 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found:"
          echo "$GRADLEW"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "Java version:"
          java -version

          echo "Gradle version:"
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "Starting Android build..."

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "Searching for generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Build outputs:"
            find "$PROJECT_DIR" \
              -path "*/build/outputs/*" \
              -type f \
              -print

            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p artifacts

          cp "${{ steps.apk.outputs.apk_path }}" \
            "artifacts/Maktab-Islami-4.9-debug.apk"

          echo "Final APK:"
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-4.9
          path: artifacts/Maktab-Islami-4.9-debug.apk
          if-no-files-found: error
          retention-days: 30
