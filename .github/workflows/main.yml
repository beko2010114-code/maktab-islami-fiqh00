name: Build Maktab Islami 4.7

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP=$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Project
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project

          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted_project

          echo "ZIP extracted successfully"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Android Project
        id: project
        run: |
          SETTINGS=$(find extracted_project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          BUILD=$(find extracted_project \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          elif [ -n "$BUILD" ]; then
            PROJECT_DIR=$(dirname "$BUILD")
          else
            echo "ERROR: Android Gradle project not found"

            echo "Extracted files:"
            find extracted_project -maxdepth 6 -type f | head -300

            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show Project
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          echo "Project:"
          echo "$PROJECT"

          ls -la "$PROJECT"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          APK=$(find "$PROJECT" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-4.7-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
