main.yml

name: Build Maktab Islami 4.9

"on":
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Find ZIP file
    id: zip
    shell: bash
    run: |
      ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" -print -quit)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No ZIP file found."
        exit 1
      fi

      echo "ZIP found: $ZIP_FILE"
      echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

  - name: Extract project ZIP
    shell: bash
    run: |
      rm -rf extracted_project
      mkdir -p extracted_project

      unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted_project

      echo "ZIP extracted successfully."

  - name: Find Android project
    id: project
    shell: bash
    run: |
      echo "Searching for Android project..."

      GRADLEW=$(find extracted_project -type f -name "gradlew" -print -quit)

      if [ -n "$GRADLEW" ]; then
        PROJECT_DIR=$(dirname "$GRADLEW")
        USE_WRAPPER=true
      else
        BUILD_FILE=$(find extracted_project -type f \( \
          -name "settings.gradle" \
          -o -name "settings.gradle.kts" \
          -o -name "build.gradle" \
          -o -name "build.gradle.kts" \
        \) -print -quit)

        if [ -z "$BUILD_FILE" ]; then
          echo "ERROR: Android/Gradle project was not found."
          find extracted_project -maxdepth 6 -type f -print | head -300
          exit 1
        fi

        PROJECT_DIR=$(dirname "$BUILD_FILE")
        USE_WRAPPER=false
      fi

      echo "PROJECT_DIR=$PROJECT_DIR"
      echo "USE_WRAPPER=$USE_WRAPPER"

      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      echo "use_wrapper=$USE_WRAPPER" >> "$GITHUB_OUTPUT"

  - name: Build APK
    shell: bash
    run: |
      cd "${{ steps.project.outputs.project_dir }}"

      if [ "${{ steps.project.outputs.use_wrapper }}" = "true" ]; then
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon --stacktrace
      else
        gradle clean assembleDebug --no-daemon --stacktrace
      fi

  - name: Find APK
    shell: bash
    run: |
      APK=$(find "${{ steps.project.outputs.project_dir }}" \
        -type f \
        -path "*/build/outputs/apk/*.apk" \
        -print -quit)

      if [ -z "$APK" ]; then
        echo "ERROR: APK was not created."

        find "${{ steps.project.outputs.project_dir }}" \
          -type f \
          -name "*.apk" \
          -print

        exit 1
      fi

      echo "APK found:"
      ls -lh "$APK"

      mkdir -p artifacts
      cp "$APK" artifacts/Maktab-Islami-4.9-debug.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Maktab-Islami-4.9-APK
      path: artifacts/Maktab-Islami-4.9-debug.apk
      if-no-files-found: error
      retention-days: 30
