name: Build Islami APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync findutils

      - name: Locate project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            -print | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        id: extract
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/islami"
          mkdir -p "$RUNNER_TEMP/islami"

          unzip -q \
            "${{ steps.zip.outputs.zip }}" \
            -d "$RUNNER_TEMP/islami"

          echo "======================================"
          echo "Extracted project files"
          echo "======================================"

          find "$RUNNER_TEMP/islami" \
            -maxdepth 5 \
            -type f | sort | head -500

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT=""

          while IFS= read -r settings; do

            DIR="$(dirname "$settings")"

            if [ -f "$DIR/app/build.gradle" ] || \
               [ -f "$DIR/app/build.gradle.kts" ]; then

              PROJECT="$DIR"
              break

            fi

          done < <(
            find "$RUNNER_TEMP/islami" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print | sort
          )

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            echo ""
            echo "Searching for Gradle files..."

            find "$RUNNER_TEMP/islami" \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              -print | sort

            exit 1
          fi

          echo "======================================"
          echo "Android project found"
          echo "======================================"

          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Copy Android project
        shell: bash
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          echo "Copying project:"
          echo "$PROJECT"

          rsync -a \
            "$PROJECT/" \
            ./

          echo "======================================"
          echo "Repository structure"
          echo "======================================"

          find . \
            -maxdepth 4 \
            -type f \
            ! -path "./.git/*" | sort | head -500

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Validating Android project"
          echo "======================================"

          if [ -f settings.gradle.kts ]; then
            echo "settings.gradle.kts: OK"
          elif [ -f settings.gradle ]; then
            echo "settings.gradle: OK"
          else
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ -f app/build.gradle.kts ]; then
            echo "app/build.gradle.kts: OK"
          elif [ -f app/build.gradle ]; then
            echo "app/build.gradle: OK"
          else
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          if [ -f app/src/main/AndroidManifest.xml ]; then
            echo "AndroidManifest.xml: OK"
          else
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo ""
          echo "Android project validation: PASS"

      - name: Check Gradle Wrapper
        shell: bash
        run: |
          if [ -f gradlew ]; then

            echo "Gradle Wrapper found."

            chmod +x gradlew

            ./gradlew --version

          else

            echo "Gradle Wrapper not found."
            echo "Using installed Gradle 8.7 instead."

            gradle --version

          fi

      - name: Clean project
        shell: bash
        run: |
          set -e

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          if [ -f gradlew ]; then

            chmod +x gradlew

            ./gradlew \
              assembleDebug \
              --no-daemon \
              --stacktrace \
              --info \
              2>&1 | tee build.log

          else

            gradle \
              assembleDebug \
              --no-daemon \
              --stacktrace \
              --info \
              2>&1 | tee build.log

          fi

      - name: Show build error
        if: failure()
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD FAILED"
          echo "======================================"

          if [ -f build.log ]; then

            echo ""
            echo "========== IMPORTANT ERROR =========="

            grep -n \
              -B 15 \
              -A 40 \
              -E \
              "FAILURE:|What went wrong|Execution failed|Could not resolve|Could not find|error:|e: " \
              build.log \
              | tail -350 || true

            echo ""
            echo "========== LAST 200 LINES =========="

            tail -200 build.log

          fi

      - name: Find APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for APK"
          echo "======================================"

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "${{ steps.apk.outputs.path }}" \
            release/Islami-debug.apk

          echo "======================================"
          echo "APK READY"
          echo "======================================"

          ls -lh release/Islami-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Islami-APK
          path: release/Islami-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Islami-Build-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
