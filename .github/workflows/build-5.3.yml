name: Build Maktab Islami 5.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK 5.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Find FINAL ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/Maktab-Islami-5.3-FULL-FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: FINAL ZIP not found"
            find "$GITHUB_WORKSPACE" -type f -name "*.zip" -print
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP"

      - name: Verify ZIP
        run: |
          set -e
          unzip -t "${{ steps.zip.outputs.zip }}"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 8 -type f -print | sort | head -1000

      - name: Locate Android source
        id: project
        shell: bash
        run: |
          set -e

          APP_DIR=$(find extracted -type d -path "*/app/src/main" -print -quit)

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: app/src/main was not found"
            find extracted -maxdepth 8 -type d -print | sort
            exit 1
          fi

          PROJECT_DIR="${APP_DIR%/app/src/main}"

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Android Gradle project
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          mkdir -p gradle

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Maktab-Islami-5.3"
include(":app")
EOF

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
EOF

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then

            cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maktabislami'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maktabislami'
        minSdk 23
        targetSdk 35
        versionCode 53
        versionName '5.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.android.material:material:1.12.0'
}
EOF

  else
    echo "Existing app Gradle file found."
  fi

      - name: Check offline data
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          ASSETS="app/src/main/assets"

          if [ ! -d "$ASSETS" ]; then
            echo "ERROR: assets directory not found"
            exit 1
          fi

          echo "Offline assets:"
          find "$ASSETS" -type f -print | sort | head -1000

          echo "Asset file count:"
          find "$ASSETS" -type f | wc -l

          if [ ! -d "$ASSETS/data" ]; then
            echo "ERROR: assets/data is missing"
            exit 1
          fi

          if [ ! -d "$ASSETS/data/quran" ]; then
            echo "ERROR: Quran data is missing"
            exit 1
          fi

          if [ ! -d "$ASSETS/data/hadith" ]; then
            echo "ERROR: Hadith data is missing"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifacts/Maktab-Islami-5.3.apk"

          echo "APK:"
          ls -lh "$GITHUB_WORKSPACE/artifacts/Maktab-Islami-5.3.apk"

      - name: Verify APK contains offline assets
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/artifacts/Maktab-Islami-5.3.apk"

          echo "Checking APK assets..."

          unzip -l "$APK" | grep "assets/" | head -100 || true

          COUNT=$(unzip -l "$APK" | grep -c "assets/" || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No offline assets found inside APK"
            exit 1
          fi

          echo "Offline asset entries: $COUNT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-5.3
          path: artifacts/Maktab-Islami-5.3.apk
          if-no-files-found: error
          retention-days: 30
