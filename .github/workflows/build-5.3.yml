name: Build Maktab Islami 5.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK 5.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip findutils file

      - name: Select FINAL 5.3 ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="${GITHUB_WORKSPACE}/Maktab-Islami-5.3-FULL-FINAL.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: Maktab-Islami-5.3-FULL-FINAL.zip was not found."
            echo "ZIP files in repository:"
            find . -type f -iname '*.zip' ! -path './.git/*' -print | sort
            exit 1
          fi

          echo "FINAL 5.3 ZIP: $ZIP_FILE"
          ls -lh "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify FINAL ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "${{ steps.find_zip.outputs.zip_file }}"

      - name: Extract FINAL project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "--- Extracted structure ---"
          find extracted -maxdepth 5 -print | sort | head -500

          echo "--- Android and Gradle files ---"
          find extracted -type f \
            \( \
              -name 'gradlew' -o \
              -name 'settings.gradle' -o \
              -name 'settings.gradle.kts' -o \
              -name 'build.gradle' -o \
              -name 'build.gradle.kts' -o \
              -name 'AndroidManifest.xml' \
            \) \
            -print | sort

      - name: Find Android project
        id: find_project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""
          USE_WRAPPER="false"

          GRADLEW=$(find extracted \
            -type f \
            -name 'gradlew' \
            -print -quit || true)

          if [[ -n "$GRADLEW" ]]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
            USE_WRAPPER="true"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            SETTINGS=$(find extracted \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print -quit || true)

            if [[ -n "$SETTINGS" ]]; then
              PROJECT_DIR="$(dirname "$SETTINGS")"
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            MANIFEST=$(find extracted \
              -type f \
              -path '*/app/src/main/AndroidManifest.xml' \
              -print -quit || true)

            if [[ -n "$MANIFEST" ]]; then
              PROJECT_DIR="$(dirname \
                "$(dirname \
                  "$(dirname \
                    "$(dirname "$MANIFEST")" \
                  )" \
                )" \
              )"

              echo "Android app detected:"
              echo "$MANIFEST"
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            BUILD_FILE=$(find extracted \
              -type f \
              \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -print -quit || true)

            if [[ -n "$BUILD_FILE" ]]; then
              PROJECT_DIR="$(dirname "$BUILD_FILE")"
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: No Android project was found."
            echo "All extracted files:"
            find extracted -type f -print | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "use_wrapper=$USE_WRAPPER" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle project when ZIP contains only the app module
        if: steps.find_project.outputs.use_wrapper != 'true'
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            echo "Gradle settings already exists."
            exit 0
          fi

          if [[ -f app/build.gradle || -f app/build.gradle.kts ]]; then
            echo "Creating temporary root Gradle files."

            cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(
        RepositoriesMode.FAIL_ON_PROJECT_REPOS
    )

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'Maktab-Islami-5.3'

include ':app'
EOF

            cat > build.gradle <<'EOF'
plugins {
}
EOF
          fi

      - name: Locate bundled assets
        id: assets
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ASSETS=$(find . \
            -type d \
            -path '*/src/main/assets' \
            -print -quit || true)

          if [[ -z "$ASSETS" ]]; then
            echo "ERROR: src/main/assets was not found."

            find . \
              -maxdepth 7 \
              -type d \
              -print | sort

            exit 1
          fi

          echo "Assets directory:"
          echo "$ASSETS"

          echo "assets_dir=$ASSETS" >> "$GITHUB_OUTPUT"

          echo "--- Bundled assets ---"
          find "$ASSETS" -type f -print | sort

          echo "--- Asset count ---"
          find "$ASSETS" -type f | wc -l

      - name: Verify Quran and the 9 required books
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="${{ steps.assets.outputs.assets_dir }}"

          FAILED=0

          check_book() {
            local LABEL="$1"
            shift

            local FOUND="false"

            for PATTERN in "$@"; do

              if find "$ASSETS" \
                -type f \
                -iname "*${PATTERN}*" \
                -print -quit | grep -q .; then

                FOUND="true"
                break
              fi

              if grep -RIl \
                --exclude='*.png' \
                --exclude='*.jpg' \
                --exclude='*.jpeg' \
                -F "$PATTERN" \
                "$ASSETS" \
                2>/dev/null | head -n 1 | grep -q .; then

                FOUND="true"
                break
              fi

            done

            if [[ "$FOUND" == "true" ]]; then
              echo "OK: $LABEL"
            else
              echo "MISSING: $LABEL"
              FAILED=1
            fi
          }

          check_book \
            "صحيح البخاري" \
            "bukhari" \
            "البخاري"

          check_book \
            "صحيح مسلم" \
            "muslim" \
            "مسلم"

          check_book \
            "سنن أبي داود" \
            "abu_dawud" \
            "abudawud" \
            "abu-dawud" \
            "أبي داود"

          check_book \
            "جامع الترمذي" \
            "tirmidhi" \
            "ترمذي"

          check_book \
            "سنن النسائي" \
            "nasai" \
            "nasa" \
            "نسائي"

          check_book \
            "سنن ابن ماجه" \
            "ibn_majah" \
            "ibnmajah" \
            "ابن ماجه"

          check_book \
            "موطأ مالك" \
            "muwatta" \
            "malik" \
            "موطأ"

          check_book \
            "الأربعون النووية" \
            "nawawi" \
            "الأربعون النووية"

          check_book \
            "الأربعون القدسية" \
            "qudsi" \
            "القدسية"

          check_book \
            "القرآن الكريم" \
            "quran" \
            "قرآن"

          if [[ "$FAILED" -ne 0 ]]; then

            echo ""
            echo "=========================================="
            echo "ERROR: REQUIRED OFFLINE CONTENT IS MISSING"
            echo "=========================================="
            echo ""
            echo "The APK will NOT be published."
            echo "The 9 books and Quran must exist in assets."
            echo ""

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ALL REQUIRED BOOKS WERE FOUND"
          echo "=========================================="

      - name: Show project structure
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Android project:"
          pwd

          echo "Project files:"
          find . \
            -maxdepth 7 \
            -type f \
            -print | sort | head -1000

      - name: Setup Gradle
        if: steps.find_project.outputs.use_wrapper != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make Gradle executable
        if: steps.find_project.outputs.use_wrapper == 'true'
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.find_project.outputs.use_wrapper }}" == "true" ]]; then

            ./gradlew \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          else

            gradle \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

          fi

      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.find_project.outputs.project_dir }}"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/*.apk' \
            -print | sort | head -n 1 || true)

          if [[ -z "$APK" ]]; then

            echo "ERROR: APK was not generated."

            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/*' \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p artifacts

          cp "$APK" \
            artifacts/Maktab-Islami-5.3-9-Books.apk

          ls -lh \
            artifacts/Maktab-Islami-5.3-9-Books.apk

          echo "apk_file=artifacts/Maktab-Islami-5.3-9-Books.apk" \
            >> "$GITHUB_OUTPUT"

      - name: Verify assets inside APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.find_apk.outputs.apk_file }}"

          echo "--- APK assets ---"

          unzip -l "$APK" \
            | grep -E '(^|/)assets/' \
            | head -1000 || true

          ASSET_LINES=$(unzip -l "$APK" \
            | grep -cE '(^|/)assets/' || true)

          if [[ "$ASSET_LINES" -le 0 ]]; then
            echo "ERROR: APK contains no assets."
            exit 1
          fi

          echo "APK asset entries: $ASSET_LINES"

          echo "Offline assets are inside the APK."

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-5.3-9-Books
          path: artifacts/Maktab-Islami-5.3-9-Books.apk
          if-no-files-found: error
          retention-days: 30
