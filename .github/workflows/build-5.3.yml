name: Build Maktab Islami 5.3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK 5.3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Select Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          # الحالة الأولى:
          # المشروع مفكوك مباشرة في جذر المستودع.
          if [ -f "app/build.gradle" ] && [ -d "app/src/main/assets/data" ]; then
            echo "project=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "Using Android project from repository root."
            exit 0
          fi

          # الحالة الثانية:
          # المشروع موجود داخل ملف ZIP.
          ZIP=""

          for candidate in \
            "$GITHUB_WORKSPACE/Maktab-Islami-5.3-FULL-FINAL-FIXED.zip" \
            "$GITHUB_WORKSPACE/Maktab-Islami-5.3-FULL-FINAL.zip"; do

            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi

          done

          # بحث احتياطي عن أي ZIP للإصدار 5.3
          if [ -z "$ZIP" ]; then
            ZIP="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name '*Maktab*5.3*.zip' \
              -print -quit || true)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: Maktab Islami 5.3 ZIP was not found."

            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              -print | sort

            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP" \
            -d "$GITHUB_WORKSPACE/extracted"

          # العثور على مشروع Android الحقيقي
          APP_GRADLE="$(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -path '*/app/build.gradle' \
              -print -quit || true
          )"

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle was not found."

            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 10 \
              -type f \
              -print | sort

            exit 1
          fi

          PROJECT="${APP_GRADLE%/app/build.gradle}"

          if [ ! -f "$PROJECT/settings.gradle" ]; then
            echo "ERROR: settings.gradle is missing."

            echo "Project:"
            echo "$PROJECT"

            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Verify project configuration
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          # يجب أن يكون AGP 8.7.3
          grep -q \
            "com.android.application.*8.7.3" \
            build.gradle

          # المشروع يستهدف API 35
          grep -q \
            "compileSdk 35" \
            app/build.gradle

          grep -q \
            "targetSdk 35" \
            app/build.gradle

          # الإصدار 5.3
          grep -q \
            "versionCode 53" \
            app/build.gradle

          echo "Project configuration OK."

      - name: Verify offline content
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("app/src/main/assets/data")

          # ==========================================
          # القرآن الكريم
          # ==========================================

          quran_file = root / "quran/i-muslim-quran-ar.json"

          if not quran_file.is_file():
              raise SystemExit(
                  f"ERROR: Quran file missing: {quran_file}"
              )

          quran = json.loads(
              quran_file.read_text(encoding="utf-8")
          )

          quran_items = quran["data"]["items"]

          if len(quran_items) != 6236:
              raise SystemExit(
                  f"ERROR: Quran contains "
                  f"{len(quran_items)} verses, expected 6236."
              )

          # ==========================================
          # الكتب التسعة
          # ==========================================

          books = {
              "sahih-al-bukhari.json": 7589,
              "sahih-muslim.json": 7563,
              "sunan-abi-dawud.json": 5274,
              "jami-at-tirmidhi.json": 3998,
              "sunan-an-nasai.json": 5765,
              "sunan-ibn-majah.json": 4343,
              "muwatta-malik.json": 1858,
              "forty-nawawi.json": 42,
              "forty-qudsi.json": 40,
          }

          total = 0

          for filename, expected in books.items():

              path = root / "books" / filename

              if not path.is_file():
                  raise SystemExit(
                      f"ERROR: Missing book: {filename}"
                  )

              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              if "data" not in data:
                  raise SystemExit(
                      f"ERROR: Invalid structure: {filename}"
                  )

              if "items" not in data["data"]:
                  raise SystemExit(
                      f"ERROR: Missing data.items: {filename}"
                  )

              items = data["data"]["items"]

              actual = len(items)

              if actual != expected:
                  raise SystemExit(
                      f"ERROR: {filename}: "
                      f"{actual} records, expected {expected}"
                  )

              total += actual

          if total != 36472:
              raise SystemExit(
                  f"ERROR: Total hadith records = {total}, "
                  f"expected 36472"
              )

          # ==========================================
          # Manifest
          # ==========================================

          manifest = root / "content-manifest-5.3.json"

          if not manifest.is_file():
              raise SystemExit(
                  "ERROR: content-manifest-5.3.json is missing."
              )

          json.loads(
              manifest.read_text(encoding="utf-8")
          )

          print("========================================")
          print("OFFLINE CONTENT VALIDATION PASSED")
          print("========================================")
          print("Quran verses: 6236")
          print("Hadith books: 9")
          print("Hadith records: 36472")
          print("All JSON files: VALID")
          print("Manifest: VALID")
          print("========================================")
          PY

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Android build..."

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

          echo "Android build completed."

      - name: Verify generated APK
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Available build outputs:"
            find app/build/outputs \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          # ==========================================
          # التأكد من وجود القرآن والكتب داخل APK
          # ==========================================

          REQUIRED_FILES=(
            "assets/data/quran/i-muslim-quran-ar.json"
            "assets/data/books/sahih-al-bukhari.json"
            "assets/data/books/sahih-muslim.json"
            "assets/data/books/sunan-abi-dawud.json"
            "assets/data/books/jami-at-tirmidhi.json"
            "assets/data/books/sunan-an-nasai.json"
            "assets/data/books/sunan-ibn-majah.json"
            "assets/data/books/muwatta-malik.json"
            "assets/data/books/forty-nawawi.json"
            "assets/data/books/forty-qudsi.json"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if ! unzip -l "$APK" | grep -F "$FILE" >/dev/null; then
              echo "ERROR: Missing from APK:"
              echo "$FILE"
              exit 1
            fi

            echo "OK: $FILE"

          done

          echo "========================================"
          echo "APK CONTENT VALIDATION PASSED"
          echo "========================================"

      - name: Prepare APK artifact
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifacts/Maktab-Islami-5.3.apk"

          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/artifacts/Maktab-Islami-5.3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-5.3
          path: artifacts/Maktab-Islami-5.3.apk
          if-no-files-found: error
          retention-days: 30
