name: Build Maktab Islami 5.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK 5.3
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required tools
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip findutils wget

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Searching repository for ZIP files..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            -print | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."

            echo ""
            echo "Repository contents:"
            find . -maxdepth 5 -type f -print

            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "ZIP extracted successfully."

          echo ""
          echo "Extracted directory structure:"
          find extracted -maxdepth 6 -type d -print | sort

          echo ""
          echo "Important project files:"
          find extracted -type f \
            \( \
              -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "AndroidManifest.xml" \
            \) \
            -print | sort

      - name: Find Android project
        id: find_project
        shell: bash
        run: |
          set -e

          echo "Searching for Android/Gradle project..."

          GRADLEW=$(find extracted \
            -type f \
            -name "gradlew" \
            ! -path "*/.git/*" \
            -print | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")

            echo "Gradle wrapper found:"
            echo "$GRADLEW"

            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "No gradlew found."
          echo "Searching for Gradle build files..."

          SETTINGS_FILE=$(find extracted \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            ! -path "*/.git/*" \
            -print | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

            echo "Gradle settings file found:"
            echo "$SETTINGS_FILE"

            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          BUILD_FILE=$(find extracted \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            ! -path "*/.git/*" \
            -print | head -n 1)

          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")

            echo "Gradle build file found:"
            echo "$BUILD_FILE"

            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo ""
          echo "ERROR: No Gradle project was found inside the ZIP."

          echo ""
          echo "All extracted files:"
          find extracted -type f -print | sort

          exit 1

      - name: Setup Gradle 8.7
        if: steps.find_project.outputs.use_wrapper != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Make Gradle wrapper executable
        if: steps.find_project.outputs.use_wrapper == 'true'
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          chmod +x gradlew

      - name: Inspect Android project
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Android project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 5 -type f -print | sort | head -500

      - name: Prepare offline data directories
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets/data
          mkdir -p app/src/main/assets/data/books
          mkdir -p app/src/main/assets/data/quran
          mkdir -p app/src/main/assets/data/hadith

          echo "Offline data directories prepared."

      - name: Check bundled religious content
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Checking bundled content..."

          if [ -d "app/src/main/assets" ]; then
            find app/src/main/assets \
              -type f \
              -print | sort | head -500
          else
            echo "WARNING: app/src/main/assets does not exist."
          fi

      - name: Build APK with Gradle Wrapper
        if: steps.find_project.outputs.use_wrapper == 'true'
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build APK with installed Gradle
        if: steps.find_project.outputs.use_wrapper != 'true'
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.find_project.outputs.project_dir }}"

          echo "Searching for generated APK..."

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build outputs:"
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p artifacts

          cp "$APK" \
            "artifacts/Maktab-Islami-5.3-debug.apk"

          echo ""
          echo "Final APK:"
          ls -lh "artifacts/Maktab-Islami-5.3-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-5.3-APK
          path: artifacts/Maktab-Islami-5.3-debug.apk
          if-no-files-found: error
          retention-days: 30
