name: Build Maktab Islami 5.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK 5.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP files..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            -print | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found in the repository."
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "ZIP extracted successfully."

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f -print | head -300

      - name: Find Android project
        id: find_project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle wrapper..."

          GRADLEW=$(find extracted \
            -type f \
            -name "gradlew" \
            ! -path "*/.git/*" \
            -print | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."

            echo ""
            echo "Searching for Gradle files..."

            find extracted -type f \
              \( \
                -name "*.gradle" \
                -o -name "*.gradle.kts" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "gradle-wrapper.properties" \
              \) \
              -print

            echo ""
            echo "Extracted directory structure:"
            find extracted -maxdepth 6 -type d -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found:"
          echo "$GRADLEW"

          echo ""
          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          chmod +x gradlew

      - name: Show project structure
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          echo "Project:"
          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 3 -type f -print | sort | head -300

      - name: Prepare offline data directories
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          mkdir -p app/src/main/assets/data
          mkdir -p app/src/main/assets/data/books
          mkdir -p app/src/main/assets/data/quran

          echo "Offline data directories are ready."

      - name: Build Debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        id: find_apk
        shell: bash
        run: |
          set -e

          PROJECT_DIR="${{ steps.find_project.outputs.project_dir }}"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Available build outputs:"
            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p artifacts

          cp "$APK" "artifacts/Maktab-Islami-5.3-debug.apk"

          ls -lh "artifacts/Maktab-Islami-5.3-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-5.3-APK
          path: artifacts/Maktab-Islami-5.3-debug.apk
          if-no-files-found: error
          retention-days: 30
