name: Build Maktab Islami 5.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK 5.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip findutils

      - name: Find FINAL ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/Maktab-Islami-5.3-FULL-FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "FINAL ZIP not found."
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" -type f -name '*.zip' -print
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found:"
          ls -lh "$ZIP"

      - name: Verify ZIP
        run: |
          set -e
          unzip -t "${{ steps.find_zip.outputs.zip }}"

      - name: Extract FINAL project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d extracted

          echo "Extracted structure:"
          find extracted -maxdepth 8 -type f -print | sort | head -1000

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT=""

          while IFS= read -r APP_MAIN; do
            if [ -d "$APP_MAIN" ]; then
              PROJECT="${APP_MAIN%/app/src/main}"
              break
            fi
          done < <(find extracted -type d -path '*/app/src/main' -print)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: app/src/main was not found."
            echo "Directories found:"
            find extracted -maxdepth 8 -type d -print | sort
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle project
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo "Project files:"
          find . -maxdepth 3 -type f -print | sort | head -500

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "Maktab-Islami-5.3"
include(":app")
EOF
          fi

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF
          fi

          if [ ! -f gradle.properties ]; then
            cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
EOF
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maktabislami'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maktabislami'
        minSdk 23
        targetSdk 35
        versionCode 53
        versionName '5.3'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.android.material:material:1.12.0'
}
EOF
          fi

          echo "Gradle project prepared."

      - name: Check offline content
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          ASSETS="app/src/main/assets"

          if [ ! -d "$ASSETS" ]; then
            echo "ERROR: assets directory does not exist."
            exit 1
          fi

          echo "Offline content:"
          find "$ASSETS" -type f -print | sort | head -1000

          echo "Total offline files:"
          find "$ASSETS" -type f | wc -l

          if [ -d "$ASSETS/data" ]; then
            echo "data directory found."
          else
            echo "WARNING: assets/data was not found."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          APK=$(find "${{ steps.project.outputs.project }}/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            if [ -d "${{ steps.project.outputs.project }}/app/build/outputs" ]; then
              find "${{ steps.project.outputs.project }}/app/build/outputs" \
                -type f \
                -print
            fi

            exit 1
          fi

          cp "$APK" "artifacts/Maktab-Islami-5.3.apk"

          echo "Generated APK:"
          ls -lh "artifacts/Maktab-Islami-5.3.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="artifacts/Maktab-Islami-5.3.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file missing."
            exit 1
          fi

          echo "APK contents:"
          unzip -l "$APK" | grep 'assets/' | head -100 || true

          echo "APK size:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maktab-Islami-5.3
          path: artifacts/Maktab-Islami-5.3.apk
          if-no-files-found: error
          retention-days: 30
